<!DOCTYPE html>
<html lang="id">
<head>
  <!-- Diganti oleh --base-href saat build (versi web disajikan dari /app/ di Laravel) -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Portal Santri As-Salafiyyah Asy-Syafi'iyyah">
  <meta name="theme-color" content="#0B6B3A">

  <!-- iOS: bisa dipasang ke Layar Utama dan tampil seperti aplikasi -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Portal Salaf">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Portal Salaf</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0B6B3A; }
    /* Layar pembuka selama aplikasi dimuat; dihapus otomatis setelah Flutter tampil */
    #memuat {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
      background: #0B6B3A;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      transition: opacity .3s ease;
    }
    #memuat img { width: 104px; height: 104px; border-radius: 50%; background: #fff; padding: 8px; box-sizing: border-box; }
    #memuat .putar {
      width: 28px; height: 28px;
      border: 3px solid rgba(255,255,255,.3); border-top-color: #F2C300;
      border-radius: 50%;
      animation: putar 0.9s linear infinite;
    }
    #memuat p { margin: 0; font-size: 14px; opacity: .85; }
    @keyframes putar { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="memuat">
    <img src="icons/Icon-192.png" alt="">
    <div class="putar"></div>
    <p>Memuat Portal Salaf…</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('memuat');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
