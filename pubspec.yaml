name: portal_salaf_app
description: "Portal Santri As-Salafiyyah Asy-Syafi'iyyah"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  flutter_secure_storage: ^11.2.0
  google_fonts: ^8.0.0
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  pdf: ^3.13.1
  printing: ^5.15.1
  image_picker: ^1.2.4
  file_picker: ^13.1.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Ikon aplikasi: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/logo.png
  adaptive_icon_foreground_inset: 18

# Splash bawaan sistem: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0B6B3A"
  image: assets/images/logo.png
  android_12:
    color: "#0B6B3A"
    image: assets/images/logo.png
    icon_background_color: "#FFFFFF"
  web: false
